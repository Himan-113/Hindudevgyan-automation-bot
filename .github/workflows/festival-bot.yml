name: Festival Bot

on:
  schedule:
    # Runs every day at 04:00 UTC; the script itself checks it's Sunday and
    # skips on every other day (see the "Today is not Sunday" check in the code)
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  run-festival-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Festival Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python bots/festival_bot.py
