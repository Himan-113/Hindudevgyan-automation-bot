name: Fix Missing Images (manual utility)

# This one is NOT scheduled. It's a cleanup tool you run yourself whenever
# you notice posts without a featured image. Go to the "Actions" tab on
# GitHub, click this workflow's name, then click "Run workflow".
on:
  workflow_dispatch: {}

jobs:
  fix-missing-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Google Cloud Service Account (if present)
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" | base64 --decode > vertex_sa_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=vertex_sa_key.json" >> $GITHUB_ENV
          echo "GCP_LOCATION=us-central1" >> $GITHUB_ENV

      - name: Run Fix Missing Images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: "us-central1"
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python fix_missing_images.py
