name: Fix Missing Images (manual utility)

# This one is NOT scheduled. It's a cleanup tool you run yourself whenever
# you notice posts without a featured image. Go to the "Actions" tab on
# GitHub, click this workflow's name, then click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      start_index:
        description: 'Start index (e.g. 31 to protect first 31 posts, or 0 for top 100 all posts)'
        required: false
        default: '31'

jobs:
  fix-missing-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Google Cloud Service Account (if present)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python setup_vertex_creds.py
          if [ -f vertex_sa_key.json ]; then
            echo "GOOGLE_APPLICATION_CREDENTIALS=vertex_sa_key.json" >> $GITHUB_ENV
            echo "GCP_LOCATION=us-central1" >> $GITHUB_ENV
          fi

      - name: Run Fix Missing Images
        env:
          FIX_START_INDEX: ${{ github.event.inputs.start_index || '31' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: "us-central1"
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python fix_missing_images.py
